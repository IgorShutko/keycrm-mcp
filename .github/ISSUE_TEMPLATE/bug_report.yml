name: Помилка в роботі сервера
description: Інструмент падає, повертає не те, або ШІ-клієнт не бачить сервер
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Перед тим як надсилати: приберіть з логів e-mail, пароль, токени, піддомен акаунта і дані клієнтів.
        Вставляйте лише той фрагмент, що стосується помилки.
  - type: input
    id: version
    attributes:
      label: Версія сервера
      description: Тег або коміт, з якого ставили
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: ШІ-клієнт, Python і система
      placeholder: Claude Code 2.x, Python 3.13, Windows 11
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Інструмент і дія
      placeholder: leads, action=move
  - type: textarea
    id: steps
    attributes:
      label: Що робили
      description: Запит до агента або аргументи виклику, без доступів
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Що сталося
      description: Текст помилки. Статус і відповідь KeyCRM, якщо сервер їх повернув
    validations:
      required: true
